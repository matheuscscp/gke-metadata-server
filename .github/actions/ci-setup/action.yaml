name: ci-setup

description: Sets up the CI environment for GKE Metadata Server workflows.

inputs:
  github-token:
    required: true
    description: The GitHub token to authenticate with.

runs:
  using: composite
  steps:
  - name: Free disk space
    shell: bash
    run: |
      set -eux
      df -h
      sudo rm -rf /usr/share/dotnet || true
      sudo rm -rf /opt/ghc || true
      sudo rm -rf /usr/local/share/boost || true
      sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
      sudo rm -rf /usr/local/lib/android || true
      docker system prune -af || true
      sudo apt-get clean || true
      df -h
  - uses: stefanprodan/timoni/actions/setup@38d47bc050dc8c5eb4a13a3e98b3a4abf23b9d11 # main
  - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ inputs.github-token }}
  - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
  - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
  - name: Install dependencies
    shell: bash
    run: |
      sudo apt-get update && sudo apt-get install -y clang llvm bpfcc-tools libbpf-dev linux-tools-azure
